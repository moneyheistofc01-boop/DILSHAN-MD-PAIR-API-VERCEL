services:
  - type: web
    name: dilshan-md-pair-api-file-storage
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: dilshan-md-session-files
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: DATA_DIR
        value: /var/data
      - key: CORS_ORIGIN
        value: https://dilshan-pairsite.pages.dev
